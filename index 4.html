<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>חברותא</title>
<meta name="description" content="חברותא – תלמידים עוזרים לתלמידים. חינם.">
<meta name="theme-color" content="#0e1028">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="alternate icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="חברותא">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1028;--bg2:#171a3d;--card:#1d2150;--line:#2c3170;--txt:#f2f3ff;--mut:#a4a8d6;
  --pink:#ff6b8a;--pinkD:#c9405f;--yel:#ffd65c;--yelD:#c9a12e;--grn:#5ee0a0;--grnD:#2f9a68;
  --sky:#5cc8ff;--skyD:#2b86b8;--vio:#a98bff;--vioD:#6f52c9;
  --rain:linear-gradient(90deg,var(--pink),var(--yel),var(--grn),var(--sky),var(--vio));
  --r:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font:16px/1.5 Assistant,system-ui,sans-serif;overscroll-behavior-y:none}
body{background:radial-gradient(120% 60% at 85% -10%,#2a2470 0,transparent 60%),radial-gradient(90% 50% at 0% 110%,#123a5a 0,transparent 60%),var(--bg);background-attachment:fixed}
h1,h2,h3,.brand,.fred{font-family:Fredoka,Assistant,sans-serif;margin:0;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
#deco{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#deco span{position:absolute;font-size:34px;opacity:.13;animation:fl 14s ease-in-out infinite;filter:saturate(1.4)}
@keyframes fl{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-28px) rotate(12deg)}}
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.page{flex:1;padding:calc(18px + env(safe-area-inset-top)) 18px calc(100px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;animation:in .28s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.center{justify-content:center}
.brand{font-size:46px;text-align:center;background:var(--rain);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
.rings{display:flex;justify-content:center;margin-bottom:-4px}
.rings i{width:54px;height:54px;border-radius:50%;border:7px solid var(--pink);display:block;animation:sp 6s ease-in-out infinite}
.rings i+i{border-color:var(--sky);margin-right:-18px;animation-delay:-3s}
@keyframes sp{50%{transform:translateY(-6px) scale(1.05)}}
.sub{color:var(--mut);text-align:center;margin:-6px 0 8px}
.card{background:linear-gradient(180deg,#22265a,#1b1f4c);border:1px solid var(--line);border-radius:var(--r);padding:16px;position:relative}
label{display:block;font-weight:700;margin:12px 0 6px}
input,select,textarea{width:100%;background:var(--bg2);border:2px solid var(--line);border-radius:14px;padding:12px 14px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--sky)}
.phone{direction:ltr;text-align:right;letter-spacing:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:14px 18px;font-weight:800;cursor:pointer;background:var(--sky);color:#08122a;width:100%;box-shadow:0 4px 0 var(--skyD);transition:transform .08s,box-shadow .08s;letter-spacing:.3px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--skyD)}
.btn.alt{background:var(--bg2);border:2px solid var(--line);color:var(--txt);box-shadow:0 4px 0 #0a0c22}
.btn.pink{background:var(--pink);color:#2a0612;box-shadow:0 4px 0 var(--pinkD)}
.btn.grn{background:var(--grn);color:#062a1a;box-shadow:0 4px 0 var(--grnD)}
.btn.yel{background:var(--yel);color:#2a2006;box-shadow:0 4px 0 var(--yelD)}
.btn.sm{width:auto;padding:8px 14px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.45;pointer-events:none}
.link{background:none;border:0;color:var(--sky);cursor:pointer;padding:6px;font-weight:700}
.err{color:var(--pink);min-height:1.4em;font-size:14px;margin-top:8px}
.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--bg2);border-radius:999px;padding:6px 13px;font-size:14px;cursor:pointer;user-select:none;font-weight:600;transition:transform .1s}
.chip:active{transform:scale(.95)}
.chip.need{background:#4a1d36;border-color:var(--pink);color:#ffd0da}
.chip.help,.chip.on{background:#123d33;border-color:var(--grn);color:#c9ffe5}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:2px 9px;margin:2px 0 2px 4px;font-weight:600}
.tag.help{background:#123d33;color:#9ff3c9}.tag.need{background:#4a1d36;color:#ffc2cf}.tag.sky{background:#123150;color:#bfe7ff}
.legend{font-size:13px;color:var(--mut)}
.avatar{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;font:700 19px Fredoka,sans-serif;color:#0e1028;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.muted{color:var(--mut)}.small{font-size:13px}.big{font-size:20px}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;align-items:center;cursor:pointer}
.item .grow,.grow{flex:1;min-width:0}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{font:700 14px Fredoka,sans-serif;color:var(--yel)}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:rgba(14,16,40,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs div{display:flex;max-width:520px;width:100%}
.tabs button{flex:1;background:none;border:0;padding:9px 0 11px;color:var(--mut);font-size:12px;cursor:pointer;position:relative;font-weight:700}
.tabs button b{display:block;font-size:22px;line-height:1.25;transition:transform .2s}
.tabs button.on{color:var(--txt)}.tabs button.on b{transform:translateY(-2px) scale(1.12)}
.tabs button.on::after{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:3px;background:var(--rain)}
.dot{position:absolute;top:7px;right:calc(50% - 18px);width:10px;height:10px;border-radius:50%;background:var(--pink);box-shadow:0 0 0 2px var(--bg)}
.head{display:flex;align-items:center;justify-content:space-between}
.pill{display:inline-flex;gap:5px;align-items:center;background:var(--bg2);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font:700 15px Fredoka,sans-serif}
.stars{color:var(--yel)}.fire{color:#ff9f5c}
.banner{background:linear-gradient(120deg,#2b2266,#163a5c);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:center}
.seg{display:flex;background:var(--bg2);border:2px solid var(--line);border-radius:14px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:10px;cursor:pointer;color:var(--mut);font-weight:700}
.seg button.on{background:var(--card);color:var(--txt);box-shadow:0 2px 0 #0a0c22}
.rainbar{height:6px;border-radius:6px;background:var(--rain);margin:-16px -16px 12px;border-radius:var(--r) var(--r) 0 0}
/* availability grid */
.avail{display:grid;grid-template-columns:auto repeat(4,1fr);gap:5px;font-size:12px;align-items:center}
.avail .c{border:2px solid var(--line);background:var(--bg2);border-radius:9px;height:32px;cursor:pointer}
.avail .c.on{background:var(--grn);border-color:var(--grn)}
.avail .h{text-align:center;color:var(--mut);font-weight:700}
/* sessions */
.sess{display:flex;gap:12px;align-items:center}
.when{flex:none;width:58px;text-align:center;background:var(--bg2);border-radius:14px;padding:6px 0;border:2px solid var(--line)}
.when b{display:block;font:700 22px Fredoka,sans-serif;line-height:1.1}
/* chat */
.chatwrap{height:100dvh;display:flex;flex-direction:column}
.chathead{display:flex;align-items:center;gap:10px;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));border-bottom:1px solid var(--line);background:rgba(14,16,40,.9)}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:78%;padding:9px 13px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word;animation:pop .2s ease}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.msg.me{align-self:flex-start;background:var(--sky);color:#08122a;border-bottom-right-radius:5px}
.msg.them{align-self:flex-end;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg time{display:block;font-size:11px;opacity:.6;margin-top:2px}
.sys{align-self:center;text-align:center;background:var(--bg2);border:2px dashed var(--line);border-radius:16px;padding:10px 14px;font-size:14px;max-width:92%}
.sys .row{justify-content:center;margin-top:8px}
.composer{display:flex;gap:8px;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(14,16,40,.95)}
.composer textarea{resize:none;height:46px;max-height:120px}
.iconbtn{flex:none;width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--bg2);cursor:pointer;font-size:20px;display:grid;place-items:center}
.iconbtn.send{background:var(--sky);border:0;color:#08122a}
.iconbtn.vid{background:var(--grn);border:0}
/* sheets / toast */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:40;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--bg2);width:100%;max-width:520px;max-height:90dvh;overflow-y:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--line);animation:up .25s ease}
@keyframes up{from{transform:translateY(40px)}}
.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);padding:10px 16px;border-radius:14px;z-index:200;box-shadow:0 8px 30px rgba(0,0,0,.4);max-width:90%;text-align:center;animation:pop .2s}
.mode{font-size:12px;text-align:center;color:var(--mut)}
.badge-local{display:inline-block;background:#3b2f0e;color:var(--yel);border-radius:999px;padding:2px 10px;font-size:12px}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--sky);animation:s 1s linear infinite;margin:40px auto}
@keyframes s{to{transform:rotate(360deg)}}
/* practice path */
.path{display:flex;flex-direction:column;align-items:center;gap:22px;padding:44px 0 40px}
.node{width:74px;height:70px;border-radius:50%;border:0;font-size:30px;cursor:pointer;background:var(--grn);box-shadow:0 7px 0 var(--grnD);position:relative;transition:transform .1s}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--grnD)}
.node.lock{background:#2c3170;box-shadow:0 7px 0 #1a1e4c;filter:grayscale(1);opacity:.7;cursor:default}
.node.cur{animation:bob 1.6s ease-in-out infinite}
.node.cur::before{content:"התחל";position:absolute;top:-34px;left:50%;transform:translateX(-50%);background:var(--card);border:2px solid var(--grn);color:var(--grn);font:700 13px Assistant;padding:3px 10px;border-radius:10px;white-space:nowrap}
.node.done{background:var(--yel);box-shadow:0 7px 0 var(--yelD)}
@keyframes bob{50%{transform:translateY(-5px)}}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--grn) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring span{width:50px;height:50px;border-radius:50%;background:var(--card);display:grid;place-items:center;font:700 15px Fredoka}
.gamecard{display:flex;gap:14px;align-items:center;cursor:pointer}
.gamecard .ic{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:28px;flex:none;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
/* lesson */
.lesson{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
.lhead{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 16px 8px}
.prog{flex:1;height:16px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--grn);border-radius:99px;transition:width .35s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12),inset 0 4px 0 rgba(255,255,255,.25)}
.lbody{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.q{font:600 23px/1.35 Fredoka,Assistant;margin:6px 0 10px}
.opt{display:block;width:100%;text-align:right;padding:15px 16px;border-radius:16px;border:2px solid var(--line);background:var(--bg2);box-shadow:0 4px 0 #0a0c22;cursor:pointer;font-weight:700;font-size:17px}
.opt.sel{border-color:var(--sky);background:#123150;box-shadow:0 4px 0 var(--skyD)}
.opt.right{border-color:var(--grn);background:#123d33;box-shadow:0 4px 0 var(--grnD)}
.opt.wrong{border-color:var(--pink);background:#4a1d36;box-shadow:0 4px 0 var(--pinkD);animation:shake .35s}
.opt.gone{opacity:.25;pointer-events:none;box-shadow:none}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs .opt{text-align:center;min-height:58px;display:grid;place-items:center;font-size:15px}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf .opt{text-align:center;font-size:20px;padding:20px}
.lfoot{padding:14px 18px calc(18px + env(safe-area-inset-bottom));border-top:2px solid var(--line);transition:background .2s}
.lfoot.ok{background:#123d33;border-color:var(--grn)}.lfoot.bad{background:#4a1d36;border-color:var(--pink)}
.lfoot .fb{font:700 19px Fredoka;margin-bottom:10px;display:none}
.lfoot.ok .fb,.lfoot.bad .fb{display:block}
.lfoot.ok .fb{color:var(--grn)}.lfoot.bad .fb{color:#ffb3c3}
.timer{font:700 18px Fredoka;color:var(--yel)}
.result{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;flex:1}
.result .medal{font-size:84px;animation:bob 1.6s ease-in-out infinite}
.statrow{display:flex;gap:10px;width:100%}
.stat{flex:1;border-radius:16px;border:2px solid var(--yel);padding:8px;text-align:center}
.stat small{display:block;font-weight:800;font-size:12px;color:#0e1028;background:var(--yel);margin:-8px -8px 6px;border-radius:12px 12px 0 0;padding:3px}
.stat b{font:700 22px Fredoka}
/* call */
.call{position:fixed;inset:0;background:#05061a;z-index:50;display:flex;flex-direction:column}
.call video{background:#000}
#rv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#lv{position:absolute;top:calc(16px + env(safe-area-inset-top));left:16px;width:108px;height:150px;object-fit:cover;border-radius:16px;border:2px solid rgba(255,255,255,.4);z-index:2;transform:scaleX(-1)}
.callinfo{position:relative;z-index:2;padding:calc(20px + env(safe-area-inset-top)) 20px;text-align:right;text-shadow:0 2px 10px #000}
.callwait{position:absolute;inset:0;display:grid;place-items:center;z-index:1;text-align:center}
.callwait .avatar{margin:0 auto 14px;animation:pulse 1.5s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(94,224,160,.6)}100%{box-shadow:0 0 0 30px rgba(94,224,160,0)}}
.callbar{position:absolute;bottom:0;left:0;right:0;z-index:2;display:flex;justify-content:center;gap:16px;padding:20px 20px calc(28px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.7))}
.callbar button{width:60px;height:60px;border-radius:50%;border:0;font-size:24px;cursor:pointer;background:rgba(255,255,255,.18);backdrop-filter:blur(8px);color:#fff}
.callbar button.off{background:#fff;color:#000}
.callbar .end{background:#ff3b5c}
.callbar .ans{background:#22c55e}

/* presence */
.ondot{position:absolute;bottom:1px;left:1px;width:13px;height:13px;border-radius:50%;background:var(--grn);border:2px solid var(--card);box-shadow:0 0 8px var(--grn)}
/* badges */
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.bdg{background:var(--bg2);border:2px solid var(--line);border-radius:16px;padding:8px 2px;text-align:center;cursor:pointer;transition:transform .15s}
.bdg:active{transform:scale(.94)}
.bdg span{display:block;font-size:28px;line-height:1.2;filter:drop-shadow(0 3px 6px rgba(255,214,92,.35))}
.bdg small{display:block;font-size:10.5px;font-weight:700;line-height:1.2;margin-top:3px}
.bdg.off{opacity:.38}.bdg.off span{filter:grayscale(1)}
.badgepop{position:fixed;inset:0;z-index:45;background:rgba(5,6,26,.78);display:grid;place-items:center;animation:fade .2s;backdrop-filter:blur(6px)}
.badgepop .bp{text-align:center;background:linear-gradient(180deg,#2a2470,#1d2150);border:2px solid var(--yel);border-radius:28px;padding:26px 30px;width:min(86vw,340px);animation:boing .6s cubic-bezier(.2,1.6,.4,1)}
.bpi{font-size:96px;margin:6px 0;animation:spinb 1.2s ease}
@keyframes boing{from{transform:scale(.3)}}
@keyframes spinb{from{transform:rotateY(720deg) scale(.5)}}
/* rating */
.starsel{display:flex;justify-content:center;gap:6px;direction:ltr}
.starsel button{background:none;border:0;font-size:46px;color:var(--line);cursor:pointer;transition:transform .15s,color .15s;padding:0 2px}
.starsel button.on{color:var(--yel);transform:scale(1.12);text-shadow:0 0 18px rgba(255,214,92,.6)}
/* admin */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 6px;text-align:center}
.kpi b{display:block;font:700 24px Fredoka}.kpi small{color:var(--mut);font-size:11.5px;font-weight:700}
#ad .card{margin-bottom:12px}#ad h3{font-size:16px;margin-bottom:10px}
.bars{display:flex;align-items:flex-end;gap:4px;height:130px;direction:ltr}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bars i{width:100%;background:var(--rain);border-radius:6px 6px 2px 2px;min-height:2px}
.bars span{font-size:10px;color:var(--yel)}.bars small{font-size:9px;color:var(--mut);margin-top:3px}
.hb{display:grid;grid-template-columns:110px 1fr 44px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.hb div{display:flex;flex-direction:column;gap:2px}.hb i{display:block;height:7px;border-radius:4px;min-width:2px}
.hb small{color:var(--mut);text-align:left}
.tbl{overflow-x:auto;max-height:380px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--card);color:var(--mut)}
/* intro */
.intro{text-align:center;align-items:center}
.introbg{width:220px;height:220px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 70%,#fff) 0,var(--c) 45%,color-mix(in srgb,var(--c) 40%,#0e1028) 100%);box-shadow:0 20px 60px color-mix(in srgb,var(--c) 45%,transparent),inset 0 -14px 0 rgba(0,0,0,.15);animation:boing .6s cubic-bezier(.2,1.6,.4,1)}
.introi{font-size:110px;animation:bob 2s ease-in-out infinite}
.dots{display:flex;gap:8px;justify-content:center;margin:18px 0 8px}.dots i{width:9px;height:9px;border-radius:9px;background:var(--line);transition:width .3s}.dots i.on{width:28px;background:var(--rain)}
.intro .btn{max-width:320px}

/* ===== motion & polish ===== */
.page>*{animation:rise .5s cubic-bezier(.2,.9,.3,1.2) both}
.page>*:nth-child(2){animation-delay:.04s}.page>*:nth-child(3){animation-delay:.08s}.page>*:nth-child(4){animation-delay:.12s}

.floatxp{position:fixed;z-index:80;font:700 22px Fredoka;color:var(--yel);pointer-events:none;text-shadow:0 3px 12px rgba(0,0,0,.5);animation:floatup 1s ease-out forwards}

/* ===== v4 design polish ===== */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:18px;background:linear-gradient(135deg,#5b3fd6 0%,#2b6fd8 55%,#1aa3a0 100%);box-shadow:0 18px 40px rgba(43,111,216,.35),inset 0 1px 0 rgba(255,255,255,.25)}
.hero::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%);top:-120px;left:-80px;animation:float2 9s ease-in-out infinite}
.hero::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,214,92,.35),transparent 70%);bottom:-90px;right:-40px;animation:float2 11s ease-in-out infinite reverse}
.hero>*{position:relative;z-index:1}
.hero .pill{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.25);backdrop-filter:blur(6px)}
@keyframes float2{50%{transform:translate(30px,20px) scale(1.1)}}
.ring.big2{width:86px;height:86px;background:conic-gradient(var(--yel) calc(var(--p)*1%),rgba(255,255,255,.2) 0)}
.ring.big2 span{width:68px;height:68px;background:rgba(14,16,40,.55);flex-direction:column;display:flex;align-items:center;justify-content:center;line-height:1.1}
.ring.big2 b{font:700 19px Fredoka}.ring.big2 small{font-size:10px;opacity:.8}
.lvl{display:flex;align-items:center;gap:8px;margin-top:8px;font:700 12px Fredoka}.lvl .prog{height:8px;background:rgba(255,255,255,.2)}
.tabs{left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));border:1px solid rgba(255,255,255,.08);border-radius:22px;padding-bottom:0;box-shadow:0 10px 40px rgba(0,0,0,.45);background:rgba(20,23,58,.88)}
.tabs button{padding:8px 0 9px}
.page{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
.gamecard .ic{background-image:linear-gradient(160deg,rgba(255,255,255,.35),transparent 60%)!important;background-blend-mode:overlay}
h3{font-size:18px}
/* arcade */
.arcade{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.arc{position:relative;overflow:hidden;border:0;border-radius:22px;padding:14px 12px 12px;text-align:right;cursor:pointer;color:#0e1028;min-height:132px;
  background:linear-gradient(145deg,var(--a),var(--b));box-shadow:0 6px 0 rgba(0,0,0,.25),0 12px 26px rgba(0,0,0,.25);transition:transform .12s,box-shadow .12s}
.arc:active{transform:translateY(4px) scale(.98);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.arc::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.45),transparent 45%);pointer-events:none}
.arc .ai{display:block;font-size:42px;line-height:1;margin-bottom:6px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25));animation:bob 2.4s ease-in-out infinite}
.arc:nth-child(2) .ai{animation-delay:-.6s}.arc:nth-child(3) .ai{animation-delay:-1.2s}.arc:nth-child(4) .ai{animation-delay:-1.8s}
.arc b{display:block;font:700 19px Fredoka}.arc small{display:block;font-size:12px;font-weight:700;opacity:.75}
.arc em{position:absolute;top:10px;left:10px;font-style:normal;font:700 11px Fredoka;background:rgba(14,16,40,.75);color:var(--yel);padding:3px 8px;border-radius:99px}
/* memory */
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px;perspective:900px}
.mc{border:0;background:none;padding:0;height:96px;cursor:pointer}
.mci{position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.mc.flip .mci{transform:rotateY(180deg)}
.mf{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;padding:6px;font:700 14px Assistant;line-height:1.25;text-align:center}
.mback{background:linear-gradient(145deg,#2c2a7a,#1d2150);border:2px solid var(--line);box-shadow:0 5px 0 #0a0c22;display:flex;align-items:center;justify-content:center}
.mback i{width:26px;height:26px;border-radius:50%;border:5px solid var(--pink);display:block}.mback i+i{border-color:var(--sky);margin-right:-9px}
.mfront{transform:rotateY(180deg);background:linear-gradient(145deg,#f2f3ff,#c9d3ff);color:#14173a;box-shadow:0 5px 0 #8c96d8}
.mc.done .mfront{background:linear-gradient(145deg,#b8ffd9,#5ee0a0);box-shadow:0 5px 0 var(--grnD);animation:pop .4s}
.mc.done{animation:matched .6s ease .2s both}
@keyframes matched{to{opacity:.55;transform:scale(.92)}}
.mc.nope .mfront{background:linear-gradient(145deg,#ffd0da,#ff6b8a);animation:shake .35s}
/* bubbles */
.bq{margin:6px 16px 0;text-align:center;z-index:2;position:relative}
.tank{position:relative;flex:1;overflow:hidden;margin-top:6px;background:radial-gradient(ellipse at 50% 120%,rgba(92,200,255,.25),transparent 60%)}
.bub{position:absolute;bottom:-120px;transform:translateX(-50%);width:min(104px,23vw);height:min(104px,23vw);font-size:min(14px,3.6vw)!important;border-radius:50%;border:2px solid hsla(var(--h),90%,75%,.8);
  background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.85) 0 7%,hsla(var(--h),90%,70%,.35) 8%,hsla(var(--h),90%,55%,.18) 60%,hsla(var(--h),90%,70%,.45) 100%);
  color:#fff;font:700 14px Assistant;line-height:1.2;padding:8px;cursor:pointer;text-shadow:0 2px 6px rgba(0,0,0,.6);
  box-shadow:inset 0 -8px 18px hsla(var(--h),90%,60%,.35),0 0 24px hsla(var(--h),90%,60%,.25);animation-name:rise2,wob;animation-timing-function:linear,ease-in-out;animation-iteration-count:1,infinite;animation-fill-mode:forwards,none}
@keyframes rise2{to{bottom:110%}}
@keyframes wob{50%{margin-left:14px}}
.bub.bad{background:var(--pink);transform:translateX(-50%) scale(.6);transition:transform .2s}
.shard{position:fixed;width:9px;height:9px;border-radius:50%;z-index:90;pointer-events:none;animation:shard .6s ease-out forwards}
@keyframes shard{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
#cb:empty{visibility:hidden}
.mfront,.opt,.bub,.q,.bq .fred{unicode-bidi:plaintext}

/* ===== mascot ===== */
.masc{position:relative;width:calc(120px*var(--s));height:calc(92px*var(--s));display:inline-block;animation:mbob 2.6s ease-in-out infinite;flex:none}
.masc i{position:absolute;top:0;width:calc(62px*var(--s));height:calc(62px*var(--s));border-radius:50%;border:calc(10px*var(--s)) solid var(--pink);background:#fff;box-sizing:border-box;box-shadow:0 calc(6px*var(--s)) 0 rgba(0,0,0,.18)}
.masc .mr1{right:0}.masc .mr2{left:0;border-color:var(--sky);z-index:1}
.masc i b{position:absolute;width:42%;height:42%;border-radius:50%;background:#14173a;top:30%;left:29%;animation:look 5s ease-in-out infinite}
.masc i b::after{content:"";position:absolute;width:35%;height:35%;border-radius:50%;background:#fff;top:15%;left:20%}
.masc i::before{content:"";position:absolute;inset:-2px;border-radius:50%;background:#e6e9ff;transform:scaleY(0);transform-origin:top;animation:mblink 4.5s infinite;z-index:2}
.masc .mm{position:absolute;bottom:calc(4px*var(--s));left:50%;width:calc(30px*var(--s));height:calc(14px*var(--s));transform:translateX(-50%);border:calc(4px*var(--s)) solid #fff;border-top:0;border-radius:0 0 calc(30px*var(--s)) calc(30px*var(--s));opacity:.9}
.masc.happy{animation:mjump .6s cubic-bezier(.2,1.8,.4,1)}.masc.happy .mm{height:calc(18px*var(--s));background:var(--pink);border-color:var(--pink)}
.masc.sad{animation:mshake .5s}.masc.sad .mm{border-radius:calc(30px*var(--s)) calc(30px*var(--s)) 0 0;border-top:calc(4px*var(--s)) solid #fff;border-bottom:0;height:calc(10px*var(--s))}
.masc.sad i b{top:42%}
.masc.wow{animation:mjump .7s cubic-bezier(.2,1.8,.4,1) 2}.masc.wow .mm{width:calc(16px*var(--s));height:calc(16px*var(--s));border-radius:50%;border-top:calc(4px*var(--s)) solid #fff}
@keyframes mbob{50%{transform:translateY(calc(-5px*var(--s))) rotate(-2deg)}}
@keyframes mjump{40%{transform:translateY(calc(-22px*var(--s))) scale(1.08) rotate(4deg)}}
@keyframes mshake{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes mblink{0%,93%,100%{transform:scaleY(0)}96%{transform:scaleY(1)}}
@keyframes look{0%,40%,100%{transform:translate(0,0)}50%,70%{transform:translate(-25%,5%)}80%{transform:translate(25%,0)}}
.speech{position:relative;background:#fff;color:#14173a;border-radius:16px;padding:8px 12px;font:700 15px Assistant;box-shadow:0 4px 0 #c9d3ff}
.speech::after{content:"";position:absolute;bottom:-8px;right:22px;border:8px solid transparent;border-top-color:#fff;border-bottom:0}
.lfoot .fbrow{display:none;align-items:center;gap:10px;margin-bottom:10px}
.lfoot.ok .fbrow,.lfoot.bad .fbrow{display:flex}.lfoot .fbrow .fb{display:block;margin:0}
/* splash */
.splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .45s,transform .45s}
.splash.out{opacity:0;transform:scale(1.08);pointer-events:none}
.splash .masc{animation:mjump 1s cubic-bezier(.2,1.8,.4,1) infinite}
/* week strip */
.week{display:flex;justify-content:space-between;margin-top:12px;direction:rtl}
.week div{display:flex;flex-direction:column;align-items:center;gap:3px;font:700 11px Assistant;color:var(--mut)}
.week span{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--bg2);border:2px solid var(--line);font-size:15px}
.week .on span{background:linear-gradient(145deg,#ffb35c,#ff6b3d);border-color:#ff9f5c;box-shadow:0 0 12px rgba(255,159,92,.5)}
.week .today{color:var(--txt)}.week .today span{border-color:var(--yel)}
/* quests */
.quest{display:flex;align-items:center;gap:10px;padding:8px 0}
.quest .qi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--bg2);flex:none}
.quest.done .qi{background:var(--grn)}
.quest .prog{height:10px}
.chest{font-size:44px;cursor:pointer;background:none;border:0;filter:grayscale(1) opacity(.5);transition:filter .3s}
.chest.ready{filter:none;animation:chestw 1.2s ease-in-out infinite}
.chest.open{filter:none;opacity:.6;cursor:default}
@keyframes chestw{0%,100%{transform:rotate(0)}20%{transform:rotate(-10deg) scale(1.1)}40%{transform:rotate(10deg) scale(1.1)}60%{transform:rotate(0)}}
/* podium */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:18px 0 10px}
.podium>div{flex:1;text-align:center;max-width:110px}
.podium .blk{border-radius:14px 14px 4px 4px;margin-top:6px;display:grid;place-items:center;font:700 26px Fredoka;color:#14173a;box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)}
.podium .p1 .blk{height:110px;background:linear-gradient(#ffe48a,#ffd65c)}.podium .p2 .blk{height:80px;background:linear-gradient(#eef0ff,#c9d3ff)}.podium .p3 .blk{height:62px;background:linear-gradient(#ffc28a,#ff9f5c)}
.podium .avatar{margin:0 auto;animation:rise .6s cubic-bezier(.2,1.6,.4,1) both}
.podium .p1 .avatar{animation-delay:.3s}.podium .p3 .avatar{animation-delay:.15s}
/* quick replies */
.quick{display:flex;gap:6px;overflow-x:auto;padding:8px 10px 0;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer}
.quick button:active{transform:scale(.95)}
.logo{width:92px;height:92px;display:block;margin:0 auto;filter:drop-shadow(0 10px 24px rgba(79,178,255,.35));animation:logoin .8s cubic-bezier(.2,1.6,.4,1) both}
.logo.big{width:150px;height:150px;animation:logoin .8s cubic-bezier(.2,1.6,.4,1) both,mbob 2.6s ease-in-out .8s infinite}
@keyframes logoin{from{opacity:0;transform:scale(.4) rotate(-12deg)}}

/* ===== v6: tour, welcome, thanks ===== */
.tour{position:fixed;inset:0;z-index:95}
.tour .spot{position:fixed;border-radius:18px;box-shadow:0 0 0 9999px rgba(5,6,26,.78);border:2px solid var(--yel);transition:all .35s cubic-bezier(.3,1.3,.5,1);animation:spotp 1.4s ease-in-out infinite}
@keyframes spotp{50%{border-color:var(--grn)}}
.tour .tip{position:fixed;left:16px;right:16px;max-width:480px;margin:0 auto;background:linear-gradient(180deg,#2a2470,#1d2150);border:2px solid var(--line);border-radius:22px;padding:16px;animation:rise .35s cubic-bezier(.2,.9,.3,1.2)}
.welcome{background:linear-gradient(135deg,#3b2f0e,#2a2470);border:1px solid #6b5a1c}
.welcome ul{margin:8px 0 0;padding-right:20px}.welcome li{margin:3px 0}
.thx{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin-top:8px;font-size:14px}
.thx b{color:var(--yel)}

/* v8: narrow screens, focus, offline */
@media (max-width:380px){.seg button{font-size:13px;padding:8px 4px}.page{padding-left:14px;padding-right:14px}.hero h2{font-size:24px!important}.statrow .stat b{font-size:18px}}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px;border-radius:8px}
.offline{position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:99;background:#4a1d36;border:1px solid var(--pink);color:#ffd0da;padding:6px 14px;border-radius:99px;font-size:13px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.remind{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));z-index:96;max-width:496px;margin:0 auto;background:linear-gradient(135deg,#1f6b4f,#1d2150);border:2px solid var(--grn);border-radius:20px;padding:14px;display:flex;gap:12px;align-items:center;box-shadow:0 12px 40px rgba(0,0,0,.5);animation:rise .4s cubic-bezier(.2,1.4,.4,1)}

/* ===== v9 design polish ===== */
.card{background:linear-gradient(180deg,rgba(40,45,105,.92),rgba(27,31,76,.92));box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 10px 30px rgba(0,0,0,.18)}
.head h2{background:linear-gradient(90deg,#fff,#c9d3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.tabs button.on b{background:linear-gradient(145deg,rgba(92,200,255,.25),rgba(169,139,255,.25));border-radius:14px;width:52px;margin:0 auto;padding:2px 0}
.btn:not(.alt){background-image:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%)}
/* find cards */
.fcard{position:relative;overflow:visible}
.fcard.best{border-color:rgba(255,214,92,.6);box-shadow:0 0 0 1px rgba(255,214,92,.35),0 12px 34px rgba(255,214,92,.12)}
.bestbadge{position:absolute;top:-11px;right:16px;background:linear-gradient(90deg,#ffd65c,#ff9f5c);color:#2a1a06;font:800 11px Assistant;padding:2px 10px;border-radius:99px;box-shadow:0 4px 12px rgba(255,159,92,.35)}
.match{flex:none;width:58px;height:58px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(closest-side,#1b1f4c 78%,transparent 80% 100%),conic-gradient(var(--grn) calc(var(--p)*1%),var(--line) 0)}
.match b{font:700 14px Fredoka;line-height:1}.match small{font-size:9px;color:var(--mut);font-weight:700}
/* chat */
.msg.me{background:linear-gradient(135deg,#6fd3ff,#4aa8ff);box-shadow:0 6px 16px rgba(74,168,255,.25)}
.msg.them{background:linear-gradient(180deg,#252a63,#1e2255)}
.chathead{background:linear-gradient(180deg,rgba(29,33,80,.97),rgba(14,16,40,.92));backdrop-filter:blur(10px)}
.composer textarea{border-radius:22px}
/* profile hero */
.profhero{background:radial-gradient(120% 90% at 50% -10%,#5b3fd6 0,#2b6fd8 45%,#1d2150 75%)!important;border-color:rgba(255,255,255,.12)!important;padding-top:26px!important}
.profhero .avatar{box-shadow:0 0 0 5px rgba(255,255,255,.18),0 14px 30px rgba(0,0,0,.35)}
.profhero .muted{color:#dfe3ff}
/* arcade sheen */
.arc{background-size:200% 200%;animation:arcsh 6s ease-in-out infinite}
@keyframes arcsh{50%{background-position:100% 100%}}
/* sheets */
.sheet{background:linear-gradient(180deg,#1f2356,#171a3d)}
.sheet::before{content:"";display:block;width:44px;height:5px;border-radius:5px;background:rgba(255,255,255,.25);margin:-8px auto 14px}
.chip.hon{background:linear-gradient(135deg,#3a2a7a,#5b3fd6);border-color:var(--vio);color:#fff;transform:scale(1.03)}
.tag.hob{background:#2b2560;color:#d9d0ff}.tag.hob.same{background:linear-gradient(90deg,#5b3fd6,#8a5cff);color:#fff}
.ideabar{display:block;width:100%;margin:4px 0 12px;padding:12px 14px;border-radius:16px;border:1.5px dashed rgba(169,139,255,.55);background:rgba(169,139,255,.08);color:var(--txt);font:600 14px Assistant;text-align:right;cursor:pointer}
.ideabar:active{transform:scale(.98)}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:70}

/* ===== v10 cool elements ===== */
/* tap ripple */
.rip{position:absolute;border-radius:50%;pointer-events:none;background:rgba(255,255,255,.35);transform:scale(0);animation:rip .55s ease-out forwards}
@keyframes rip{to{transform:scale(2.6);opacity:0}}
/* hero animated aurora */
.hero{position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:-40%;pointer-events:none;background:conic-gradient(from 0deg,transparent 0 60%,rgba(255,255,255,.14) 70%,transparent 80%);animation:spin 9s linear infinite;z-index:0}
.hero>*{position:relative;z-index:1}
@keyframes spin{to{transform:rotate(1turn)}}
/* flame flicker + star twinkle in pills */
.pill.fire{animation:flick 1.6s ease-in-out infinite}
@keyframes flick{0%,100%{filter:drop-shadow(0 0 0 rgba(255,140,60,0))}50%{filter:drop-shadow(0 0 8px rgba(255,140,60,.75))}}
.pill.stars{animation:twk 2.4s ease-in-out infinite}
@keyframes twk{0%,100%{filter:none}50%{filter:drop-shadow(0 0 7px rgba(255,214,92,.8))}}
/* progress bar shimmer */
.prog i{position:relative;overflow:hidden}
.prog i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.55) 50%,transparent 80%);transform:translateX(-100%);animation:shim 2.6s ease-in-out infinite}
@keyframes shim{60%,100%{transform:translateX(100%)}}
/* online dot pulse */
.ondot{animation:pls 2s ease-out infinite}
@keyframes pls{0%{box-shadow:0 0 0 0 rgba(88,214,141,.7)}80%,100%{box-shadow:0 0 0 9px rgba(88,214,141,0)}}
/* best-match badge shine */
.bestbadge{overflow:hidden}
.bestbadge::after{content:"";position:absolute;top:0;bottom:0;width:30%;left:-40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);animation:bshine 3s ease-in-out infinite}
@keyframes bshine{50%,100%{left:120%}}
/* match ring fill animation */
@property --pp{syntax:'<number>';inherits:false;initial-value:0}
.match{animation:mfill 1.1s cubic-bezier(.2,.8,.2,1) both;background:radial-gradient(closest-side,#1b1f4c 78%,transparent 80% 100%),conic-gradient(var(--grn) calc(var(--pp)*1%),var(--line) 0)}
@keyframes mfill{from{--pp:0}to{--pp:var(--p)}}
/* tab icon bounce */
.tabs button.on b{animation:tbn .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes tbn{0%{transform:scale(.7)}100%{transform:scale(1)}}
/* card press tilt */
.gamecard,.fcard,.arc{transition:transform .15s}
.gamecard:active,.fcard:active,.arc:active{transform:scale(.97) rotate(-.4deg)}
/* idea bar glow */
.ideabar{animation:ibg 3s ease-in-out infinite}
@keyframes ibg{50%{border-color:rgba(169,139,255,.95);box-shadow:0 0 18px rgba(169,139,255,.25)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}

/* v12: a11y, call report, entrance, splash */
.callrep{margin-top:6px;background:rgba(255,107,138,.9);border:0;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;cursor:pointer;color:#fff}
.hc{--bg:#000;--bg2:#0a0a0a;--card:#0d0d0d;--line:#fff;--txt:#fff;--mut:#e8e8e8}
.hc body{background:#000}.hc .card,.hc .btn,.hc input,.hc select,.hc textarea{border:2px solid #fff}.hc #deco{display:none}
.rm *,.rm *::before,.rm *::after{animation:none!important;transition:none!important}
.dys body{letter-spacing:.04em;word-spacing:.12em;line-height:1.8}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.skip{position:absolute;top:-60px;inset-inline-start:8px;background:var(--yel);color:#111;padding:8px 14px;border-radius:10px;z-index:200;font-weight:700}.skip:focus{top:8px}
#app.enter>.page>.card,#app.enter>.page>.row,#app.enter>.page>.list>*{animation:rise .5s cubic-bezier(.2,.9,.3,1) both}
#app.enter>.page>*:nth-child(2){animation-delay:.05s}#app.enter>.page>*:nth-child(3){animation-delay:.1s}#app.enter>.page>*:nth-child(4){animation-delay:.15s}#app.enter>.page>*:nth-child(5){animation-delay:.2s}#app.enter>.page>*:nth-child(n+6){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}}
.splash .logo.big{animation:pop .8s cubic-bezier(.2,1.6,.4,1) both}
.splash .brand{background:var(--rain);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:44px;animation:rise .7s .25s both}
.splash .muted{animation:rise .7s .5s both}
.splash::after{content:"";width:120px;height:5px;border-radius:9px;background:var(--rain);background-size:200% 100%;animation:slide 1.2s linear infinite}
@keyframes pop{from{opacity:0;transform:scale(.4) rotate(-12deg)}}
@keyframes slide{to{background-position:-200% 0}}

.xpgo{max-width:260px}.xpre{color:#fff}
/* light theme */

[data-theme=light] body{background:radial-gradient(120% 60% at 85% -10%,#e0dcff 0,transparent 60%),radial-gradient(90% 50% at 0% 110%,#d2ecff 0,transparent 60%),#f3f4ff}
[data-theme=light] .sheet{background:#fff;border-top-color:var(--line)}[data-theme=light] .sheet-bg{background:rgba(20,20,60,.35)}
[data-theme=light] .toast{background:#fff;color:var(--txt)}[data-theme=light] #deco span{opacity:.2}
[data-theme=light] .tabs>div,[data-theme=light] .tabs{background:rgba(255,255,255,.92)}

[data-theme=light] .chips .chip.on{background:var(--vio)}

[data-theme=light] .card{background:#fff;box-shadow:0 6px 22px rgba(70,70,150,.10);border-color:var(--line)}

[data-theme=light] .chip.need{background:#ffe3ea;color:#8a2442}[data-theme=light] .chip.help,[data-theme=light] .chip.on{background:#d6f7e8;color:#0d5a3c}

.aiov{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column}
.aihead{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 14px 8px}.aihead select{width:auto;max-width:42%}
.aimodes{display:flex;gap:6px;overflow-x:auto;padding:4px 12px 8px;scrollbar-width:none}.aimodes button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:99px;padding:7px 14px;font-weight:700;cursor:pointer}.aimodes button.on{background:var(--vioD);border-color:var(--vio);color:#fff}
.aimsgs{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px}.aiintro{text-align:center;margin:auto;max-width:300px}

.langpick{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.langpick button{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700;cursor:pointer}.langpick button.on{background:var(--vioD);border-color:var(--vio);color:#fff}
.offbar{position:fixed;top:0;left:0;right:0;z-index:300;background:#c9405f;color:#fff;text-align:center;padding:8px 12px;font-weight:700;transform:translateY(-110%);transition:transform .25s}.offbar.show{transform:none}

/* v15: desktop layout (wide screens): sidebar navigation, two-column pages, centered dialogs */
@media (min-width:960px){
  #deco span{font-size:44px}
  #app{max-width:none;margin:0;margin-right:240px;width:calc(100% - 240px)}
  .page{width:100%;max-width:1080px;margin-inline:auto;padding:34px 40px 48px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 22px;align-items:start;align-content:start;grid-auto-flow:row dense}
  .page>*{margin-bottom:0;min-width:0}
  .page>.hero,.page>.profhero,.page>.head,.page>.seg,.page>.statrow,.page>.list,.page>#res,.page>.empty,.page>h1,.page>h2{grid-column:1/-1}
  .page>.list,.page>#res{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px}
  .page.pp{grid-template-columns:minmax(0,1fr);max-width:760px}
  .page.center{display:flex;flex-direction:column;max-width:520px;justify-content:center;padding-bottom:48px}
  .page.center>*{margin-bottom:0}
  .hero{padding:26px 30px}
  .badges{grid-template-columns:repeat(6,1fr)}
  .tabs{top:0;bottom:0;left:auto;right:0;width:240px;border-radius:0;border:0;border-inline-start:1px solid var(--line);padding:26px 14px;background:rgba(20,23,58,.96);box-shadow:none;display:block;overflow-y:auto}
  .tabs::before{content:"חברותא";display:block;font:600 30px Fredoka,Assistant,sans-serif;margin:0 14px 22px;background:var(--rain);-webkit-background-clip:text;background-clip:text;color:transparent}
  .tabs div{flex-direction:column;gap:6px;max-width:none}
  .tabs button{flex:none;display:flex;flex-direction:row;align-items:center;gap:14px;font-size:17px;padding:12px 16px;border-radius:16px;text-align:start;width:100%}
  .tabs button b{display:inline-block;width:auto!important;margin:0!important;padding:0!important;background:none!important;font-size:24px;transform:none!important;animation:none!important}
  .tabs button:hover{background:rgba(255,255,255,.06)}
  .tabs button.on{background:rgba(169,139,255,.2);color:var(--txt)}.tabs button.on::after{display:none}
